<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 300" role="img" aria-labelledby="title-tiny-transformer desc-tiny-transformer"><title id="title-tiny-transformer">Inside the neural training step</title><desc id="desc-tiny-transformer">Inputs and shifted targets come from the same sequence. Backpropagation changes weights only on the training path.</desc><defs><marker id="arrow-tiny-transformer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#717b86"/></marker></defs><path d="M210,67 C230,67 230,67 242,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-tiny-transformer)"/><path d="M440,67 C460,67 460,67 472,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-tiny-transformer)"/><path d="M575,100 V162" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-tiny-transformer)"/><path d="M480,202 H448" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-tiny-transformer)"/><rect x="20" y="35" width="190" height="65" rx="5" fill="#eff5ff" stroke="#b9c4d0"/><text x="34" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Byte sequence</text><text x="34" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Input: A B C</text><rect x="250" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Causal transformer</text><text x="264" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Predict B C D</text><rect x="480" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Cross-entropy</text><text x="494" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Target: B C D</text><rect x="480" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Backpropagation</text><text x="494" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Parameter gradients</text><rect x="250" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">AdamW step</text><text x="264" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Update the weights</text><path d="M250 202 H115 V108" stroke="#3564a5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow-tiny-transformer)"/><text x="120" y="190" font-size="12" font-family="Arial" fill="#3564a5">Next training step</text></svg>