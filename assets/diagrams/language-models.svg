<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 300" role="img" aria-labelledby="title-language-models desc-language-models"><title id="title-language-models">A causal transformer</title><desc id="desc-language-models">Tokens pass through masked attention and a feed-forward block. Residual paths preserve information. The output predicts the next token.</desc><defs><marker id="arrow-language-models" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#717b86"/></marker></defs><path d="M210,67 C230,67 230,67 242,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-language-models)"/><path d="M440,67 C460,67 460,67 472,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-language-models)"/><path d="M575,100 V162" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-language-models)"/><path d="M480,202 H448" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-language-models)"/><rect x="20" y="35" width="190" height="65" rx="5" fill="#eff5ff" stroke="#b9c4d0"/><text x="34" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Text → tokens</text><text x="34" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Token identifiers</text><rect x="250" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Embeddings</text><text x="264" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Token + position</text><rect x="480" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Attention block</text><text x="494" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Causal mask + residual</text><rect x="480" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Feed-forward block</text><text x="494" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">MLP + residual</text><rect x="250" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Logits → softmax</text><text x="264" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Next-token distribution</text></svg>