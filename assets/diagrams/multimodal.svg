<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 300" role="img" aria-labelledby="title-multimodal desc-multimodal"><title id="title-multimodal">Preserve the input boundary</title><desc id="desc-multimodal">Media preprocessing is part of the evaluated system. Perception and downstream task performance need separate checks.</desc><defs><marker id="arrow-multimodal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#717b86"/></marker></defs><path d="M210,67 C230,67 230,67 242,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-multimodal)"/><path d="M440,67 C460,67 460,67 472,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-multimodal)"/><path d="M575,100 V162" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-multimodal)"/><path d="M480,202 H448" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-multimodal)"/><rect x="20" y="35" width="190" height="65" rx="5" fill="#eff5ff" stroke="#b9c4d0"/><text x="34" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Source media</text><text x="34" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Image / audio / video</text><rect x="250" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Preprocessing</text><text x="264" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Crop / sample / encode</text><rect x="480" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Model inference</text><text x="494" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Perception + reasoning</text><rect x="480" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Task output</text><text x="494" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Text / regions / media</text><rect x="250" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Task-specific grader</text><text x="264" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Accuracy + utility</text></svg>