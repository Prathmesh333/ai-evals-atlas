<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 300" role="img" aria-labelledby="title-human-evaluation desc-human-evaluation"><title id="title-human-evaluation">From rubric to defensible labels</title><desc id="desc-human-evaluation">Pilot the rubric, blind identities, and randomize positions. Adjudication preserves both original judgments and the final label.</desc><defs><marker id="arrow-human-evaluation" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#717b86"/></marker></defs><path d="M210,67 C230,67 230,67 242,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-human-evaluation)"/><path d="M440,67 C460,67 460,67 472,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-human-evaluation)"/><path d="M575,100 V162" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-human-evaluation)"/><path d="M480,202 H448" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-human-evaluation)"/><rect x="20" y="35" width="190" height="65" rx="5" fill="#eff5ff" stroke="#b9c4d0"/><text x="34" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Rubric + examples</text><text x="34" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Define each criterion</text><rect x="250" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Pilot annotation</text><text x="264" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Resolve ambiguity</text><rect x="480" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Blinded review</text><text x="494" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Randomized positions</text><rect x="480" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Agreement audit</text><text x="494" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Inspect disagreements</text><rect x="250" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Adjudicated labels</text><text x="264" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Keep the audit trail</text></svg>