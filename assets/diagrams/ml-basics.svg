<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 300" role="img" aria-labelledby="title-ml-basics desc-ml-basics"><title id="title-ml-basics">Training is a feedback loop</title><desc id="desc-ml-basics">The loss compares a prediction with a target. Gradients guide parameter updates; new examples test generalization.</desc><defs><marker id="arrow-ml-basics" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#717b86"/></marker></defs><path d="M210,67 C230,67 230,67 242,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-ml-basics)"/><path d="M440,67 C460,67 460,67 472,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-ml-basics)"/><path d="M575,100 V162" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-ml-basics)"/><path d="M480,202 H448" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-ml-basics)"/><rect x="20" y="35" width="190" height="65" rx="5" fill="#eff5ff" stroke="#b9c4d0"/><text x="34" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Training example</text><text x="34" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Input + target</text><rect x="250" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Model</text><text x="264" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Current parameters</text><rect x="480" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Prediction</text><text x="494" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Compare with target</text><rect x="480" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Loss + gradients</text><text x="494" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Compute the update</text><rect x="250" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Optimizer</text><text x="264" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Change parameters</text><path d="M250 202 H115 V108" stroke="#3564a5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow-ml-basics)"/><text x="120" y="190" font-size="12" font-family="Arial" fill="#3564a5">Next training step</text></svg>