<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 370" role="img" aria-labelledby="t-rag-pipeline d-rag-pipeline"><title id="t-rag-pipeline">Retrieval has an indexing path and a query path</title><desc id="d-rag-pipeline">Index permitted documents in advance. At query time, retrieve relevant chunks, apply access checks, and provide evidence to the generator. Evaluate retrieval and answer support separately.</desc><defs><marker id="a-rag-pipeline" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#718096"/></marker></defs><text x="20" y="24" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#1c2938">INDEXING</text><rect x="20" y="44" width="190" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="115.0" y="69" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Permitted documents</text><text x="115.0" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Split into chunks</text><rect x="255" y="44" width="190" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="350.0" y="69" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Embedding model</text><text x="350.0" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Vectors for chunks</text><rect x="490" y="44" width="190" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="585.0" y="69" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Search index</text><text x="585.0" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Vectors + text + metadata</text><path d="M210 75 H247" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-rag-pipeline)"/><path d="M445 75 H482" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-rag-pipeline)"/><text x="20" y="156" text-anchor="start" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#1c2938">QUERY TIME</text><rect x="20" y="180" width="190" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="115.0" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Question</text><text x="115.0" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Query representation</text><rect x="255" y="180" width="190" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="350.0" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Retrieve + authorize</text><text x="350.0" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Select relevant evidence</text><rect x="490" y="180" width="190" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="585.0" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Generator</text><text x="585.0" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Question + evidence</text><path d="M210 211 H247" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-rag-pipeline)"/><path d="M445 211 H482" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-rag-pipeline)"/><path d="M585 106 V135 H355 V172" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-rag-pipeline)"/><path d="M585 242 V275 H363" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-rag-pipeline)"/><rect x="150" y="276" width="205" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="252.5" y="301" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Answer + citations</text><text x="252.5" y="322" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Check correctness + support</text></svg>