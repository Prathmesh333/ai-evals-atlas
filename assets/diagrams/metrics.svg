<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 300" role="img" aria-labelledby="title-metrics desc-metrics"><title id="title-metrics">A score needs several views</title><desc id="desc-metrics">Evaluate correctness, coverage, and operating cost. The release decision uses all three views.</desc><defs><marker id="arrow-metrics" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#717b86"/></marker></defs><path d="M210,132 C230,132 230,47 242,47" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-metrics)"/><path d="M210,132 C230,132 230,137 242,137" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-metrics)"/><path d="M210,132 C230,132 230,227 242,227" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-metrics)"/><path d="M440,47 C460,47 460,132 472,132" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-metrics)"/><path d="M440,137 C460,137 460,132 472,132" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-metrics)"/><path d="M440,227 C460,227 460,132 472,132" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-metrics)"/><rect x="20" y="100" width="190" height="65" rx="5" fill="#eff5ff" stroke="#b9c4d0"/><text x="34" y="126" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Task outcomes</text><text x="34" y="147" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Per-case evidence</text><rect x="250" y="15" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="41" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Correctness</text><text x="264" y="62" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Precision / recall</text><rect x="250" y="105" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="131" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Coverage</text><text x="264" y="152" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Answers / requests</text><rect x="250" y="195" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="221" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Operating cost</text><text x="264" y="242" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Latency + resources</text><rect x="480" y="100" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="126" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Decision</text><text x="494" y="147" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Declared tradeoffs</text></svg>