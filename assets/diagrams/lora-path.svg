<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 370" role="img" aria-labelledby="t-lora-path d-lora-path"><title id="t-lora-path">A low-rank update beside a frozen weight</title><desc id="d-lora-path">The output combines the frozen projection Wx and a learned low-rank update BAx, scaled by a chosen factor. This shows one adapted projection, not an entire model.</desc><defs><marker id="a-lora-path" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#718096"/></marker></defs><rect x="20" y="150" width="120" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="80.0" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Input x</text><rect x="230" y="45" width="220" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="340.0" y="70" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Frozen W</text><text x="340.0" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Base projection</text><rect x="200" y="240" width="150" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="275.0" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Train A</text><text x="275.0" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Down-project</text><rect x="390" y="240" width="150" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="465.0" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Train B</text><text x="465.0" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Up-project</text><rect x="565" y="150" width="125" height="62" rx="5" fill="#eef4fd" stroke="#b9c4d0"/><text x="627.5" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Add</text><text x="627.5" y="196" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Output y</text><path d="M140 181 H168 V76 H222" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-lora-path)"/><path d="M140 181 H168 V271 H192" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-lora-path)"/><path d="M350 271 H382" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-lora-path)"/><path d="M450 76 H627 V142" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-lora-path)"/><path d="M540 271 H627 V220" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-lora-path)"/><text x="280" y="350" text-anchor="start" font-family="Arial,sans-serif" font-size="16" font-weight="600" fill="#1c2938">y = Wx + scale × BAx</text><text x="478" y="227" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Scale update</text></svg>