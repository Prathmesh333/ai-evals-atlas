<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 370" role="img" aria-labelledby="t-distributed-workers d-distributed-workers"><title id="t-distributed-workers">Data parallel training</title><desc id="d-distributed-workers">Replicas process different batches. An all-reduce combines gradients before each replica applies the update. Other parallelism strategies partition different parts of the work.</desc><defs><marker id="a-distributed-workers" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#718096"/></marker></defs><rect x="235" y="15" width="240" height="62" rx="5" fill="#eef4fd" stroke="#b9c4d0"/><text x="355.0" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Versioned training data</text><text x="355.0" y="61" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Different batch per worker</text><rect x="20" y="126" width="190" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="115.0" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Worker 1</text><text x="115.0" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Forward + backward</text><path d="M355 77 V100 H115 V118" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-distributed-workers)"/><path d="M115 188 V222 H355 V248" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-distributed-workers)"/><rect x="255" y="126" width="190" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="350.0" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Worker 2</text><text x="350.0" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Forward + backward</text><path d="M355 77 V100 H350 V118" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-distributed-workers)"/><path d="M350 188 V222 H355 V248" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-distributed-workers)"/><rect x="490" y="126" width="190" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="585.0" y="151" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Worker 3</text><text x="585.0" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Forward + backward</text><path d="M355 77 V100 H585 V118" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-distributed-workers)"/><path d="M585 188 V222 H355 V248" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-distributed-workers)"/><rect x="235" y="256" width="240" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="355.0" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">All-reduce gradients</text><text x="355.0" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Then update every replica</text><path d="M475 287 H697 V157 H688" fill="none" stroke="#718096" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-distributed-workers)"/><path d="M235 287 H8 V157 H12" fill="none" stroke="#718096" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-distributed-workers)"/><path d="M420 256 V210 H440 V196" fill="none" stroke="#718096" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-distributed-workers)"/><text x="355" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#536170">Each worker holds the same model; data batches differ.</text></svg>