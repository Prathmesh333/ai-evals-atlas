<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 370" role="img" aria-labelledby="t-platform-architecture d-platform-architecture"><title id="t-platform-architecture">The evaluation service architecture</title><desc id="d-platform-architecture">The runner reads versioned inputs and dispatches trials. Preserve raw artifacts before applying graders. Reports link back to the run and case identifiers.</desc><defs><marker id="a-platform-architecture" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#718096"/></marker></defs><rect x="20" y="20" width="190" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="115.0" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Dataset registry</text><text x="115.0" y="66" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Immutable case versions</text><rect x="20" y="120" width="190" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="115.0" y="145" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Run manifest</text><text x="115.0" y="166" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Model + grader + budget</text><rect x="255" y="70" width="190" height="62" rx="5" fill="#eef4fd" stroke="#b9c4d0"/><text x="350.0" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Scheduler / runner</text><text x="350.0" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Trials + retries + limits</text><rect x="490" y="70" width="190" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="585.0" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Isolated workers</text><text x="585.0" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Model adapters + tools</text><path d="M210 51 H230 V91 H247" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-platform-architecture)"/><path d="M210 151 H230 V113 H247" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-platform-architecture)"/><path d="M445 101 H482" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-platform-architecture)"/><rect x="490" y="240" width="190" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="585.0" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Artifact storage</text><text x="585.0" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Outputs + state + traces</text><rect x="255" y="240" width="190" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="350.0" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Versioned graders</text><text x="350.0" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Per-case scores</text><rect x="20" y="240" width="190" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="115.0" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Decision report</text><text x="115.0" y="286" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Slices + uncertainty</text><path d="M585 132 V232" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-platform-architecture)"/><path d="M490 271 H453" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-platform-architecture)"/><path d="M255 271 H218" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-platform-architecture)"/><text x="2