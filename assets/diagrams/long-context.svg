<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 300" role="img" aria-labelledby="title-long-context desc-long-context"><title id="title-long-context">Locate the retrieval bottleneck</title><desc id="desc-long-context">Compare the same questions under no-context, retrieved-context, and correct-evidence conditions. These are diagnostic conditions, not successive product stages.</desc><defs><marker id="arrow-long-context" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#717b86"/></marker></defs><path d="M210,132 C230,132 230,132 242,132" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-long-context)"/><path d="M440,132 C460,132 460,47 472,47" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-long-context)"/><path d="M440,132 C460,132 460,137 472,137" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-long-context)"/><path d="M440,132 C460,132 460,227 472,227" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-long-context)"/><rect x="20" y="100" width="190" height="65" rx="5" fill="#eff5ff" stroke="#b9c4d0"/><text x="34" y="126" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Question set</text><text x="34" y="147" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Stable questions</text><rect x="250" y="100" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="126" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Context condition</text><text x="264" y="147" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Choose an ablation</text><rect x="480" y="15" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="41" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">No context</text><text x="494" y="62" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Knowledge baseline</text><rect x="480" y="105" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="131" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Retrieved context</text><text x="494" y="152" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Actual retrieval</text><rect x="480" y="195" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="221" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Oracle context</text><text x="494" y="242" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Correct evidence</text></svg>