<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 300" role="img" aria-labelledby="title-rag-agents desc-rag-agents"><title id="title-rag-agents">Retrieval and the agent loop</title><desc id="desc-rag-agents">The agent selects a tool, reads its observation, and can repeat. A final-state grader checks the outcome.</desc><defs><marker id="arrow-rag-agents" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#717b86"/></marker></defs><path d="M210,67 C230,67 230,67 242,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-rag-agents)"/><path d="M440,67 C460,67 460,67 472,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-rag-agents)"/><path d="M575,100 V162" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-rag-agents)"/><path d="M480,202 H448" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-rag-agents)"/><rect x="20" y="35" width="190" height="65" rx="5" fill="#eff5ff" stroke="#b9c4d0"/><text x="34" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">User task</text><text x="34" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Goal + permissions</text><rect x="250" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Agent controller</text><text x="264" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Model + context</text><rect x="480" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Tool / retrieval</text><text x="494" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Search or act</text><rect x="480" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Observation</text><text x="494" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Evidence + new state</text><rect x="250" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Outcome grader</text><text x="264" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Inspect final state</text><path d="M480 235 V266 H345 V108" stroke="#3564a5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow-rag-agents)"/><text x="350" y="285" font-size="12" font-family="Arial" fill="#3564a5">Repeat within the budget</text></svg>