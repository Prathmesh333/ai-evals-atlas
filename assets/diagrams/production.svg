<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 300" role="img" aria-labelledby="title-production desc-production"><title id="title-production">The production feedback loop</title><desc id="desc-production">Online signals produce reviewed cases. A candidate must pass evaluation before a controlled rollout.</desc><defs><marker id="arrow-production" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#717b86"/></marker></defs><path d="M210,67 C230,67 230,67 242,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-production)"/><path d="M440,67 C460,67 460,67 472,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-production)"/><path d="M575,100 V162" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-production)"/><path d="M480,202 H448" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-production)"/><rect x="20" y="35" width="190" height="65" rx="5" fill="#eff5ff" stroke="#b9c4d0"/><text x="34" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Production signals</text><text x="34" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Failures + feedback</text><rect x="250" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Reviewed cases</text><text x="264" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Redacted + labeled</text><rect x="480" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Regression suite</text><text x="494" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Versioned examples</text><rect x="480" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Candidate change</text><text x="494" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Paired evaluation</text><rect x="250" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Controlled rollout</text><text x="264" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Monitor + rollback</text></svg>