<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 300" role="img" aria-labelledby="title-serving-performance desc-serving-performance"><title id="title-serving-performance">The latency boundary</title><desc id="desc-serving-performance">Client timing includes the declared network and queue boundaries. A non-streaming timer reaches completion and does not expose first-token timing.</desc><defs><marker id="arrow-serving-performance" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#717b86"/></marker></defs><path d="M210,67 C230,67 230,67 242,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-serving-performance)"/><path d="M440,67 C460,67 460,67 472,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-serving-performance)"/><path d="M575,100 V162" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-serving-performance)"/><path d="M480,202 H448" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-serving-performance)"/><rect x="20" y="35" width="190" height="65" rx="5" fill="#eff5ff" stroke="#b9c4d0"/><text x="34" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Client sends request</text><text x="34" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Start end-to-end clock</text><rect x="250" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Queue + prefill</text><text x="264" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Process input context</text><rect x="480" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">First output token</text><text x="494" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">TTFT boundary</text><rect x="480" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Decode remaining</text><text x="494" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Inter-token timings</text><rect x="250" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Complete response</text><text x="264" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">End-to-end duration</text></svg>