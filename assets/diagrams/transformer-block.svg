<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 510" role="img" aria-labelledby="t-transformer-block d-transformer-block"><title id="t-transformer-block">Inside one pre-normalized transformer block</title><desc id="d-transformer-block">Layer normalization precedes each sublayer. Each residual addition preserves a direct path for the block input. Repeat the block, then apply final normalization and the output head.</desc><defs><marker id="a-transformer-block" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#718096"/></marker></defs><rect x="215" y="18" width="280" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="355.0" y="43" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Input x</text><text x="355.0" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Token representations</text><rect x="215" y="100" width="280" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="355.0" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">LayerNorm → attention</text><text x="355.0" y="146" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Causal multi-head attention</text><rect x="215" y="198" width="280" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="355.0" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Add residual</text><text x="355.0" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">x + attention(norm(x))</text><rect x="215" y="290" width="280" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="355.0" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">LayerNorm → MLP</text><text x="355.0" y="336" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Position-wise transformation</text><rect x="215" y="390" width="280" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="355.0" y="415" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Add residual</text><text x="355.0" y="436" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Previous state + MLP output</text><path d="M355 80 V92" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-transformer-block)"/><path d="M355 162 V190" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-transformer-block)"/><path d="M355 260 V282" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-transformer-block)"/><path d="M355 352 V382" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-transformer-block)"/><path d="M215 48 H130 V229 H207" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-transformer-block)"/><text x="30" y="155" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#536170">Residual x</text><path d="M495 228 H570 V421 H503" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-transformer-block)"/><text x="579" y="325" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#536170">Residual</text><path d="M355 452 V482" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-transformer-block)"/><text x="355" y="502" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#536170">Next block / final normalization and output head</text></svg>