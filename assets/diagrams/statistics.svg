<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 350" role="img" aria-labelledby="title-statistics desc-statistics"><title id="title-statistics">A paired comparison</title><desc id="desc-statistics">Both systems receive the same tasks. Resample matched cases to estimate uncertainty in their difference.</desc><defs><marker id="arrow-statistics" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#717b86"/></marker></defs><path d="M210,132 C230,132 230,57 242,57" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-statistics)"/><path d="M210,132 C230,132 230,207 242,207" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-statistics)"/><path d="M440,57 C460,57 460,132 472,132" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-statistics)"/><path d="M440,207 C460,207 460,132 472,132" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-statistics)"/><path d="M575,165 V247" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-statistics)"/><rect x="20" y="100" width="190" height="65" rx="5" fill="#eff5ff" stroke="#b9c4d0"/><text x="34" y="126" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Same task set</text><text x="34" y="147" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Stable case IDs</text><rect x="250" y="25" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="51" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Baseline A</text><text x="264" y="72" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Score every case</text><rect x="250" y="175" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="201" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Candidate B</text><text x="264" y="222" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Score every case</text><rect x="480" y="100" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="126" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Paired differences</text><text x="494" y="147" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">B score − A score</text><rect x="480" y="255" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="281" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Bootstrap interval</text><text x="494" y="302" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Resample task IDs</text></svg>