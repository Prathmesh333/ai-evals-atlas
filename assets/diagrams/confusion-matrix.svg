<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 370" role="img" aria-labelledby="t-confusion-matrix d-confusion-matrix"><title id="t-confusion-matrix">Read a confusion matrix</title><desc id="d-confusion-matrix">Rows show the actual class. Columns show the prediction. Precision divides true positives by the predicted-positive column. Recall divides true positives by the actual-positive row.</desc><defs><marker id="a-confusion-matrix" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#718096"/></marker></defs><text x="355" y="24" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#1c2938">Predicted class</text><text x="235" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#1c2938">Positive</text><text x="445" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#1c2938">Negative</text><text x="30" y="122" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#1c2938">Actual +</text><text x="30" y="220" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="600" fill="#1c2938">Actual −</text><rect x="140" y="82" width="190" height="80" rx="5" fill="#eef4fd" stroke="#b9c4d0"/><text x="235.0" y="107" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">TP = 8</text><text x="235.0" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Correct positive</text><rect x="350" y="82" width="190" height="80" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="445.0" y="107" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">FN = 2</text><text x="445.0" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Missed positive</text><rect x="140" y="180" width="190" height="80" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="235.0" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">FP = 4</text><text x="235.0" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">False alarm</text><rect x="350" y="180" width="190" height="80" rx="5" fill="#eef4fd" stroke="#b9c4d0"/><text x="445.0" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">TN = 86</text><text x="445.0" y="226" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Correct negative</text><text x="140" y="305" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#536170">Precision = 8 / (8 + 4) = 66.7%</text><text x="140" y="331" text-anchor="start" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#536170">Recall = 8 / (8 + 2) = 80.0%</text><text x="560" y="122" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Positive row</text><text x="560" y="144" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">denominator</text><text x="560" y="163" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">for recall</text></svg>