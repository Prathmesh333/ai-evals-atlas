<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 370" role="img" aria-labelledby="t-data-splits d-data-splits"><title id="t-data-splits">Keep three jobs separate</title><desc id="d-data-splits">Fit weights on training data. Select settings with validation data. Freeze choices before the final test. Do not feed test results back into selection.</desc><defs><marker id="a-data-splits" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#718096"/></marker></defs><rect x="225" y="16" width="260" height="62" rx="5" fill="#eef4fd" stroke="#b9c4d0"/><text x="355.0" y="41" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Group + deduplicate</text><text x="355.0" y="62" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Then split the source documents</text><rect x="20" y="145" width="200" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="120.0" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Training</text><text x="120.0" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Fit parameters</text><path d="M355 78 V108 H120 V137" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-data-splits)"/><rect x="255" y="145" width="200" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="355.0" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Validation</text><text x="355.0" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Choose settings</text><path d="M355 78 V108 H355 V137" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-data-splits)"/><rect x="490" y="145" width="200" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="590.0" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Test</text><text x="590.0" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Final estimate</text><path d="M355 78 V108 H590 V137" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-data-splits)"/><path d="M120 207 V262 H347" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-data-splits)"/><rect x="355" y="232" width="200" height="62" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="455.0" y="257" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#1c2938">Frozen candidate</text><text x="455.0" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Model + configuration</text><path d="M355 207 V224" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-data-splits)"/><path d="M590 207 V323 H455 V302" fill="none" stroke="#718096" stroke-width="1.5"  marker-end="url(#a-data-splits)"/><text x="30" y="284" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Learn weights</text><text x="502" y="346" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#536170">Evaluate once choices are fixed</text></svg>