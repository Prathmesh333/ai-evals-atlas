<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 300" role="img" aria-labelledby="title-safety-robustness desc-safety-robustness"><title id="title-safety-robustness">Test the full safeguard boundary</title><desc id="desc-safety-robustness">A request passes through controls before and after the model. Evaluate allowed requests and disallowed requests separately.</desc><defs><marker id="arrow-safety-robustness" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#717b86"/></marker></defs><path d="M210,67 C230,67 230,67 242,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-safety-robustness)"/><path d="M440,67 C460,67 460,67 472,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-safety-robustness)"/><path d="M575,100 V162" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-safety-robustness)"/><path d="M480,202 H448" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-safety-robustness)"/><rect x="20" y="35" width="190" height="65" rx="5" fill="#eff5ff" stroke="#b9c4d0"/><text x="34" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Test requests</text><text x="34" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Allowed + disallowed</text><rect x="250" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Input controls</text><text x="264" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Identity + permissions</text><rect x="480" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Model + tools</text><text x="494" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Restricted environment</text><rect x="480" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Output controls</text><text x="494" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Policy + monitoring</text><rect x="250" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Audit outcomes</text><text x="264" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Failures + overrefusal</text></svg>