<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 300" role="img" aria-labelledby="title-graders desc-graders"><title id="title-graders">Grade, then audit the grader</title><desc id="desc-graders">Use deterministic checks where possible. Calibrate subjective scores against independent human labels.</desc><defs><marker id="arrow-graders" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#717b86"/></marker></defs><path d="M210,67 C230,67 230,67 242,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-graders)"/><path d="M440,67 C460,67 460,67 472,67" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-graders)"/><path d="M575,100 V162" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-graders)"/><path d="M480,202 H448" fill="none" stroke="#717b86" stroke-width="1.5" marker-end="url(#arrow-graders)"/><rect x="20" y="35" width="190" height="65" rx="5" fill="#eff5ff" stroke="#b9c4d0"/><text x="34" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Candidate output</text><text x="34" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Untrusted content</text><rect x="250" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Code checks</text><text x="264" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Schema + exact rules</text><rect x="480" y="35" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="61" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Model judge</text><text x="494" y="82" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Narrow rubric</text><rect x="480" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Human calibration</text><text x="494" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Audit disagreements</text><rect x="250" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Versioned score</text><text x="264" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Grader + evidence</text></svg>