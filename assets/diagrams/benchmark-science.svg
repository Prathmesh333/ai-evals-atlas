ext><rect x="480" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="494" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Versioned release</text><text x="494" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Protocol + evidence</text><rect x="250" y="170" width="190" height="65" rx="5" fill="#fff" stroke="#b9c4d0"/><text x="264" y="196" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#17212f">Maintenance</text><text x="264" y="217" font-family="Arial,sans-serif" font-size="11.5" fill="#536170">Exposure + corrections</text></svg>