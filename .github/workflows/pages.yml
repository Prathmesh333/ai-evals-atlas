name: Validate and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and check generated pages
        run: |
          python tools/build.py
          git diff --exit-code
          python tests/check_site.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --check assets/app.js
      - name: Run browser checks
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/browser_checks.py
      - name: Stage static site
        run: |
          mkdir _site
          cp *.html .nojekyll _site/
          cp -r assets _site/
          python -c "import shutil; shutil.copytree('labs', '_site/labs', ignore=shutil.ignore_patterns('__pycache__', 'runs'))"
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
